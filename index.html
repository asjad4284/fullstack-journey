<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Grid Practice</title>
    <style>
        body{
            width: 50%;
        }
    </style>
</head>
<body>
    <div style="
        display: grid;
        grid-template-columns: 100px 100px;
    ">
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>Text</p></div>
    </div>

    <div style="
        margin-top: 10px;
        display: grid;
        grid-template-columns: 100px 100px 200px;
    ">
        <div style="background-color: lightblue;">100px</div>
        <div style="background-color: lightpink;">100px <p>text</p></div>
        <div style="background-color: lightpink;">200px</div>
    </div>

    <div style="
        margin-top: 10px;
        display: grid;
        grid-template-columns: 50PX 1fr 75px;
    ">
        <div style="background-color: lightblue;">COL 1</div>
        <div style="background-color: lightpink;">COL 2</div>
        <div style="background-color: lightblue;">COL 3</div>
    </div>

    <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        column-gap: 10px;
        row-gap: 40px;
    ">
        <div style="height: 100px; background-color: lightblue;">100px</div>
        <div style="height: 100px; background-color: lightpink;">100px <p>text</p></div>
        <div style="height: 100px; background-color: lightblue;">100px</div>
        <div style="height: 100px; background-color: lightpink;">200px</div>
        <div style="height: 100px; background-color: lightblue;">100px</div>
        <div style="height: 100px; background-color: lightpink;">200px</div>
    </div>
</body>
</html>
