<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS fundamentals</title>
    <script src="index.js"></script>
    <style>
        .search-box{
            width: 350px;
            /* height: 50px; */
            font-size: 17px;
            margin-left: 500px;
            padding: 15px;
            border-radius: 50px;
            border-color: rgba(225, 209, 209, 0.683);
            border-style: solid;
            box-shadow: 0px 1px 5px rgb(0, 0, 0,0.1);
            
        }
        div{
            border: 1px solid black;
            height: 40px;
        }
        p{
           margin: 0px; 
           display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <input class="search-box" type="text" placeholder="Search Google or type a URL">
    <div>
        <p>This is p1</p>
        <p>This is p2</p>
        <p>This is p3</p>
    </div>
</body>
</html>
